# audit:allow test-scenario-coverage reason: |
#   Phase 1 환경설정 화면은 입력·저장이 코어 /api/admin/plugins/{id}/settings 에 위임되는
#   단순 자동바인딩 폼이라, axes cross product 의 런타임 효과(저장 성공/실패 왕복)는 코어 설정
#   컨트롤러가 책임진다. 본 확장의 effects(3섹션 구조 / 6필드 / 크리덴셜 마스킹 / webhook 안내 /
#   저장 버튼 게이팅 / i18n 정합 / 권한·메뉴·알림 정의 / 설정 초기값 로드)는 PHPUnit 12건
#   (InstallationTest·EnumTest) + Vitest 22건(plugin_settings.test.tsx) 정적 검증으로 가드된다.
#   런타임 Playwright spec 은 계획서 §9 방침에 따라 실연동 검증(PO 직접 수행, 인증·발송 환경 필요)
#   단계에서 최초 도입하며, 그 시점에 @scenario/@effects docblock 완전 매핑을 추가한다. 그때까지
#   매니페스트는 명세로 유지한다.

feature: 비즈뿌리오 메시징 환경설정 (Phase 1)

description: |
  관리자 환경설정 화면(admin/plugin_settings.json)에서 비즈뿌리오 연동 정보를 입력·저장한다.
  코어 플러그인 설정 인프라(/api/admin/plugins/{id}/settings)에 자동바인딩(_local.form)으로
  위임하며, 3 섹션(API 연동 / 발송 설정 / 연동 안내)으로 구성된다.

  핵심 동작:
    - API 연동: 연동 환경(dev/live) + 비즈뿌리오 아이디 + 비밀번호 + API 키
    - 발송 설정: 발신번호 + 알림톡 발신프로필 키
    - 연동 안내: 발송 결과 수신 webhook 주소(readonly 표시)
    - 크리덴셜(password/api_key/sender_key)은 type=password 마스킹 + frontend_schema expose:false
    - 저장은 hasChanges 없으면 비활성, 있으면 코어 설정 API 로 PUT
    - 설치·활성화 시 권한 2개(view/manage)·메뉴 3개·잔액부족 알림 정의 생성 + 설정 초기값 로드

  ※ 알림톡 채널 기본 body 시드(3영역)는 채널 등록(Phase 3)·탭 연동(Phase 6)과 강결합이므로
    Phase 6 으로 이관(plugin.php getNotificationDefinitions 주석 참조).

axes:
  credential_state: [empty, filled]
  environment: [dev, live]
  field_kind: [credential, plain, readonly]

exclusions:
  - { field_kind: readonly, credential_state: filled, reason: "webhook 주소는 고정 표시값 — 운영자 입력 대상 아님" }

effects:
  # 섹션 구조
  - three_sections_api_sending_integration_present
  # 입력 필드
  - six_input_fields_bound_by_name
  - credential_fields_masked_as_password
  - plain_fields_use_text_input
  - environment_select_has_dev_live_options
  # 연동 안내
  - webhook_address_shown_readonly
  # 저장
  - save_button_disabled_without_changes
  - save_puts_to_core_plugin_settings_api
  - only_registered_handlers_used
  # 다국어
  - all_referenced_i18n_keys_exist_in_ko_and_en
  # 설치·활성화 (백엔드)
  - install_creates_view_and_manage_permissions
  - activate_creates_hierarchical_admin_menus
  - deactivate_removes_plugin_menus
  - balance_low_notification_targets_admin
  - settings_defaults_load_with_dev_environment

test_files:
  - plugins/_bundled/sirsoft-message_bizppurio/resources/js/__tests__/layouts/plugin_settings.test.tsx
  - plugins/_bundled/sirsoft-message_bizppurio/tests/Feature/Installation/InstallationTest.php
  - plugins/_bundled/sirsoft-message_bizppurio/tests/Unit/Enums/EnumTest.php

audit:
  status: codified
