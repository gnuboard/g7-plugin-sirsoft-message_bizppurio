  - test_mode_off_does_not_require_api_key_or_sender_key
  - test_mode_on_empty_credentials_return_200
  - test_mode_off_filled_credentials_return_200
  - validation_error_messages_use_localized_field_labels
  - test_mode_off_selects_live_domain_test_mode_on_selects_dev_domain
  # 리포트 수신 설정
  - report_url_endpoint_returns_absolute_url_from_app_url
  - report_url_endpoint_requires_authentication
  - report_section_shows_readonly_url_with_copy_button
  # 저장
